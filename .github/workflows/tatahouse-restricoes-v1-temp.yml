name: TATA House Restricoes V1 Temp

on:
  push:
    branches:
      - feat/tatahouse-governanca-house-cloud-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply deterministic patch
        run: node .github/scripts/apply-tatahouse-restricoes-bridge-v1.mjs
      - name: Diff check
        run: git diff --check
      - name: JSON parse
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const root='compliance/kpis/tatahouse';
          const files=fs.readdirSync(root).filter(f=>f.endsWith('.json'));
          for(const f of files) JSON.parse(fs.readFileSync(path.join(root,f),'utf8'));
          console.log('JSON_PASS='+files.length);
          NODE
      - name: JavaScript syntax
        run: |
          for f in compliance/kpis/tatahouse/*.js; do node --check "$f"; done
      - name: Node tests
        run: |
          set -e
          count=0
          for f in compliance/kpis/tatahouse/*.test.cjs; do
            node "$f"
            count=$((count+1))
          done
          echo "NODE_TEST_FILES_PASS=$count"
      - name: Bridge static contract
        run: |
          grep -q 'house_governanca_restricoes_v1.js' compliance/kpis/tatahouse/planejador-v2.html
          grep -q 'restr.responderPedido' compliance/kpis/tatahouse/planejador-v2.html
          grep -q 'contextoAberto.unidadeFonte' compliance/kpis/tatahouse/planejador-v2.html
          echo 'RESTRICOES_BRIDGE_WIRED=PASS'
      - name: Scope gate
        run: |
          bad=$(git diff --name-only 42b795f879f11dd2cd290eec8b26993f7da5e9c9...HEAD | grep -v '^compliance/kpis/tatahouse/' | grep -v '^.github/scripts/apply-tatahouse-restricoes-bridge-v1.mjs$' | grep -v '^.github/workflows/tatahouse-restricoes-v1-temp.yml$' || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Commit verified bridge
        run: |
          if git diff --quiet; then
            echo "NO_PATCH_DIFF=PASS"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compliance/kpis/tatahouse/planejador-v2.html
          git commit -m "feat(tatahouse): sincronizar restricoes do Plus no planejador"
          git push
