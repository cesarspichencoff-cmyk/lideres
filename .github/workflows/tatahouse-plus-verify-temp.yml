name: TATA House Plus Verify Temp

on:
  push:
    branches:
      - feat/tatahouse-governanca-house-cloud-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Diff check
        run: git diff --check 42b795f879f11dd2cd290eec8b26993f7da5e9c9...HEAD
      - name: JSON parse
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const root='compliance/kpis/tatahouse';
          const files=fs.readdirSync(root).filter(f=>f.endsWith('.json'));
          for(const f of files) JSON.parse(fs.readFileSync(path.join(root,f),'utf8'));
          console.log('JSON_PASS='+files.length);
          NODE
      - name: JavaScript syntax
        run: |
          for f in compliance/kpis/tatahouse/*.js; do node --check "$f"; done
      - name: Node tests
        run: |
          set -e
          count=0
          for f in compliance/kpis/tatahouse/*.test.cjs; do
            node "$f"
            count=$((count+1))
          done
          echo "NODE_TEST_FILES_PASS=$count"
      - name: Scope gate
        run: |
          bad=$(git diff --name-only 42b795f879f11dd2cd290eec8b26993f7da5e9c9...HEAD | grep -v '^compliance/kpis/tatahouse/' | grep -v '^.github/workflows/tatahouse-plus-verify-temp.yml$' || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
