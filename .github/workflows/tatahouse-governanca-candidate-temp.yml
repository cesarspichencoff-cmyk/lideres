name: TATÁ House Governança candidate validation

on:
  push:
    branches:
      - 'feat/tatahouse-governanca-house-cloud-v1'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run TATÁ House Governança regressions
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for f in compliance/kpis/tatahouse/house_governanca_*.test.cjs; do
            echo "RUN $f"
            node "$f"
            count=$((count + 1))
          done
          test "$count" -ge 1
          git diff --check
          echo "HOUSE_GOVERNANCA_TEST_FILES=$count"
          echo "HOUSE_GOVERNANCA_CANDIDATE_REGRESSION=PASS"
          echo "SUPABASE_MUTATIONS=0"
          echo "PRODUCTION_WRITES=0"
