name: TATA House governance bridge URL shadow gate

on:
  push:
    branches: [feat/house-governanca-phase2]
    paths:
      - '.github/workflows/tatahouse-governanca-bridge-temp.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-governanca-phase2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Point iframe to minimal House bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compliance/kpis/tatahouse/operacao-house.html')
          s=p.read_text()
          old='src="https://tata-house.github.io/"'
          new='src="https://tata-house.github.io/governanca-bridge.html"'
          if s.count(old)!=1: raise SystemExit(f'root iframe count={s.count(old)}')
          if new in s: raise SystemExit('bridge URL already present')
          p.write_text(s.replace(old,new,1))
          PY
          grep -F 'src="https://tata-house.github.io/governanca-bridge.html"' compliance/kpis/tatahouse/operacao-house.html
          grep -F "const HOUSE_ORIGIN='https://tata-house.github.io'" compliance/kpis/tatahouse/operacao-house.html
          git diff --check
      - name: Verify JS remains valid and diff bounded
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('compliance/kpis/tatahouse/operacao-house.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/house-panel.js').write_text('\n'.join(x for x in scripts if x.strip()))
          PY
          node --check /tmp/house-panel.js
          test "$(git diff --name-only)" = "compliance/kpis/tatahouse/operacao-house.html"
      - name: Commit only after gate
        run: |
          git config user.name 'VÉRTICE CI'
          git config user.email 'actions@users.noreply.github.com'
          git add compliance/kpis/tatahouse/operacao-house.html
          git commit -m 'perf(lideres): use minimal House governance bridge'
          git push origin HEAD:feat/house-governanca-phase2
