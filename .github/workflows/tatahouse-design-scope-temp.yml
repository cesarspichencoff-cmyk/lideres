name: TATA House Print Scope Temp

on:
  push:
    branches:
      - feat/tatahouse-governanca-house-cloud-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-print-only-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Design contract
        run: node compliance/kpis/tatahouse/house_governanca_design_contract_v1.test.cjs
      - name: Preserve Lideres font families and global typography
        run: |
          base=42b795f879f11dd2cd290eec8b26993f7da5e9c9
          file=compliance/kpis/tatahouse/cardapio.html
          git show "$base:$file" | grep -F 'fonts.googleapis.com/css2?family=DM+Sans' > /tmp/base-font-link
          grep -F 'fonts.googleapis.com/css2?family=DM+Sans' "$file" > /tmp/head-font-link
          diff -u /tmp/base-font-link /tmp/head-font-link
          git show "$base:$file" | grep -F "body { font-family: 'DM Sans', sans-serif;" > /tmp/base-body-font
          grep -F "body { font-family: 'DM Sans', sans-serif;" "$file" > /tmp/head-body-font
          diff -u /tmp/base-body-font /tmp/head-body-font
          grep -Fq "font-family:'DM Mono',monospace" "$file"
          echo "LIDERES_FONT_FAMILIES_PRESERVED=PASS"
          echo "LIDERES_GLOBAL_TYPOGRAPHY_UNCHANGED=PASS"
      - name: Scope assertion
        run: |
          grep -q '"escopoVisual": "SOMENTE_IMPRESSO_HOUSE"' compliance/kpis/tatahouse/house_governanca_design_contract_v1.json
          grep -q '"alterarFonteLideres": false' compliance/kpis/tatahouse/house_governanca_design_contract_v1.json
          grep -q '"alterarTipografiaLideres": false' compliance/kpis/tatahouse/house_governanca_design_contract_v1.json
          echo "PRINT_ONLY_SCOPE=PASS"
